services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:?Set ZHIPU_API_KEY in deploy/.env}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MILVUS_URI: http://milvus:19530
      REDIS_URL: redis://redis:6379/0
      DATABASE_ENABLED: "false"
      HF_HOME: /app/runtime_data/model_cache
    volumes:
      - app_data:/app/runtime_data
    depends_on:
      - milvus
      - redis
    networks:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Set BASIC_AUTH_USER in deploy/.env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?Set BASIC_AUTH_HASH in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - backend

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - backend

  milvus:
    image: milvusdb/milvus:v3.0.1
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    security_opt:
      - seccomp:unconfined
    volumes:
      - milvus_data:/var/lib/milvus
      - ../embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ../user.yaml:/milvus/configs/user.yaml:ro
    networks:
      - backend

networks:
  backend:

volumes:
  app_data:
  caddy_data:
  caddy_config:
  redis_data:
  milvus_data:
